# =============================================================================
# 苍穹外卖 管理端 Nginx 站点配置
# 作用：① 托管前端静态文件；② 反向代理后端；③ 终止 TLS。
#
# 重要：本文件只应包含「属于 Nginx 层」的变量（域名、证书路径、上游地址）。
#      应用密钥（数据库口令、JWT 密钥、DeepSeek/微信/OSS 密钥）不放这里——
#      它们由后端 JVM 通过环境变量读取，见 deploy/sky-server.env.example。
#      原因与替代方案见 deploy/README-部署.md 第 3 节。
#
# 需要你填充的位置以 “# TODO:” 标注。
# =============================================================================

# 后端 Spring Boot 上游（默认与 Nginx 同机 8080）
upstream sky_backend {
    server 127.0.0.1:8080;   # TODO: 若后端不在本机，改成实际 host:port
    keepalive 32;
}

# ---- HTTP：本地/内网先跑起来可直接用这个 server 块 ----
server {
    listen 80;
    server_name _;           # TODO: 上线公网时改成你的域名，如 admin.example.com

    # 上线 HTTPS 后，取消下面两行注释把 80 全量跳转到 443
    # return 301 https://$host$request_uri;
    # }

    # 前端构建产物目录（npm run build 生成的 dist）
    root /var/www/sky-admin;  # TODO: 改成前端 dist 的实际部署路径
    index index.html;

    # 前端路由回退（该项目用 hash 路由，此项作为兜底）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- AI 助手 SSE 流：必须关闭缓冲，否则不流式 ----
    location /api/agent/ {
        rewrite ^/api/(.*)$ /admin/$1 break;
        proxy_pass http://sky_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ---- 管理端接口：前端调用 /api/**，此处改写为后端 /admin/** ----
    location /api/ {
        rewrite ^/api/(.*)$ /admin/$1 break;
        proxy_pass http://sky_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;   # 覆盖文件上传（后端默认限制 5MB）
    }

    # ---- 微信支付结果回调（公网必须可达，无需登录）----
    location /notify/ {
        proxy_pass http://sky_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- 来单提醒 WebSocket ----
    location /ws/ {
        proxy_pass http://sky_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---- C 端（小程序/H5）接口，如无 C 端可整段删除 ----
    # location /user/ {
    #     proxy_pass http://sky_backend;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # ---- 纵深防御：不对公网暴露 Druid 监控台与接口文档 ----
    # （审计发现二者默认不在后端鉴权范围内，生产建议在此拦掉）
    location /druid/ { return 404; }
    location ~ ^/(v3/api-docs|swagger-ui) { return 404; }

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

